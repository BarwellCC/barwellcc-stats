<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barwell CC — Scorecard</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A5478">
<script>
// Applied before paint so a stored preference doesn't flash the other theme.
(function(){
  var stored = localStorage.getItem('barwellcc-theme');
  if(stored === 'dark' || stored === 'light') document.documentElement.setAttribute('data-theme', stored);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    /* Navy sampled from the club's actual crest (barwellcc.co.uk) - navy blue
       ring/hare on a gold circle - replacing the site's earlier invented
       green so it reads as "Barwell CC" (and pairs with the Play-Cricket
       logo, itself navy-on-white). Fixed, same in both themes. Var name kept
       as pitch-green across every page rather than renamed, to keep this a
       value-only change. */
    --pitch-green: #1A5478;
    --pitch-green-dark: #0D3550;
    --cream: #F6F1E4;
    /* Light-mode neutrals used to share --brass's exact hue (~43deg), just
       lighter/desaturated - fine against the old green structure, but once
       gold became a real accent colour (--gold-hover on dropdown borders/checkbox ticks) that
       meant the "neutral" backgrounds were secretly the same colour as the
       accent, so gold never read as distinct - everything sat in one muddy
       warm family with navy alone on the outside. Desaturated these toward
       true neutral gray (same hue kept faintly, ~9-15% saturation instead of
       30-50%) so both navy and gold pop against genuinely neutral scaffolding
       instead of competing with a tinted background. */
    --bg-page: #F4F3F1;
    --card: #FDFDFC;
    --row-even: #F1F0EE;
    --head-bg: #E8E6E3;
    --ink: #201E18;
    --ink-soft: #5B5548;
    /* --accent used to be a maroon/red (text/links/section labels) - replaced
       with a blue from the same navy family as --pitch-green, but more
       saturated so it still reads as a distinct "accent" rather than a
       repeat of the muted structural navy. --win/--loss (result pill) are
       untouched - green/red there is a functional win-loss code, not a
       branding colour. */
    --maroon: #1A5478;
    --accent: #0A6CB3;
    --brass: #B8923A;
    --brass-bright: #D4AF5A;
    --line: #DCDAD5;
    --line-strong: #BFBBB0;
    --win: #2F5D3A;
    --loss: #7A2E2E;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* Dark neutrals shifted from a green tint to a navy tint (bg-page/card/
         row-even/head-bg/line/line-strong), to match the new crest-navy
         scheme instead of the site's old invented green. */
      --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
      --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5;
      --line: #2B3944; --line-strong: #3D4F5C; --win: #4F8C5C; --loss: #C1584F;
    }
  }
  :root[data-theme="dark"]{
    --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
    --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5;
    --line: #2B3944; --line-strong: #3D4F5C; --win: #4F8C5C; --loss: #C1584F;
    color-scheme: dark;
  }
  :root[data-theme="light"]{ color-scheme: light; }
  /* Reserves the scrollbar gutter always, whether or not the page is tall
     enough to need it - otherwise .page's centering shifts a few pixels
     depending on content height (e.g. Stats before/after a search returns
     results, or between pages with very different row counts), which reads
     as "the container is a different width" even though max-width is the
     same everywhere. */
  html{ scrollbar-gutter: stable; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ============ MOBILE-FIRST BASE STYLES ============ */
  body{
    margin:0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .15s ease, color .15s ease;
  }
  .page{ max-width: 980px; margin: 0 auto; padding: 0 12px 48px; }

  /* ---- Shared site nav (Fixtures / Averages / Stats) + theme toggle ---- */
  .site-nav{ display:flex; align-items:stretch; background: var(--pitch-green-dark); margin: 0 -12px; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; }
  .site-nav-links{ display:flex; flex:1; }
  .site-nav-links a{
    flex: 1 1 0; text-align:center; padding: 11px 8px;
    font-family:'Inter'; font-weight:600; font-size: 12px; letter-spacing:0.05em; text-transform:uppercase;
    color: rgba(246,241,228,0.62); text-decoration:none; border-bottom: 2px solid transparent;
  }
  .site-nav-links a:hover{ color: var(--cream); }
  .site-nav-links a.active{ color: var(--brass-bright); border-bottom-color: var(--brass); }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width: 42px; border:none; border-left: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(246,241,228,0.62); cursor:pointer; padding:0;
  }
  .theme-toggle:hover{ color: var(--brass-bright); }
  .theme-toggle svg{ width:16px; height:16px; }
  .theme-toggle .icon-sun{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{ display:block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{ display:none; }
  }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }

  /* ---- Match header / score summary ---- */
  .back-link{
    display:inline-block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft);
    text-decoration:none; margin: 14px 0 10px;
  }
  .back-link:hover{ color: var(--accent); }
  .match-header{
    background: linear-gradient(180deg, var(--pitch-green) 0%, var(--pitch-green-dark) 100%);
    color: var(--cream);
    border-radius: var(--radius);
    padding: 18px 16px 16px;
    margin-bottom: 18px;
    position: relative;
    overflow: hidden;
  }
  .match-header::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .match-teams{ font-family: 'Fraunces', serif; font-weight: 600; font-size: 19px; line-height:1.3; position:relative; }
  .match-teams .vs{ color: var(--brass-bright); font-size: 13px; font-weight: 700; margin: 0 6px; text-transform:uppercase; }
  .match-meta{ font-size: 12px; color: rgba(246,241,228,0.72); margin-top: 5px; position:relative; }
  .score-summary{ display:flex; flex-direction:column; gap: 10px; margin-top: 16px; position:relative; }
  .score-block{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom: 8px; border-bottom: 1px solid rgba(246,241,228,0.16); }
  .score-block:last-of-type{ border-bottom:none; padding-bottom:0; }
  .score-team{ font-size: 13px; font-weight: 600; }
  .score-team.us{ color: var(--brass-bright); }
  .score-figure{ font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; }
  .score-overs{ font-size: 11px; color: rgba(246,241,228,0.6); font-weight: 500; margin-left: 6px; }
  .match-result-row{ display:flex; align-items:center; justify-content: space-between; gap: 10px; margin-top: 14px; position:relative; }
  .match-result{ display:flex; align-items:center; gap:8px; font-size: 13px; font-weight: 600; }
  .result-note{ font-weight: 400; color: rgba(246,241,228,0.72); }
  /* Play-Cricket attribution logo (white/transparent variant, site/img/) -
     same row as the result, right-aligned - only for matches synced from the
     Play-Cricket API (not historic/scraped ones). The onerror handler on the
     <img> itself hides it cleanly if the file's ever missing, rather than
     showing a broken-image icon. */
  .pc-logo-link{ flex-shrink:0; }
  .pc-logo{ display:block; height: 20px; width:auto; }
  @media (min-width: 640px){ .pc-logo{ height: 25px; } }

  .result-pill{
    display:inline-flex; align-items:center; justify-content:center;
    width: 22px; height:22px; border-radius: 5px; font-size: 12px; font-weight: 700;
    background: var(--line-strong); color: var(--ink-soft); /* neutral fallback for any result code without specific styling below */
  }
  .result-pill.W{ background: var(--win); color:#fff; }
  .result-pill.L{ background: var(--loss); color:#fff; }
  .result-pill.T, .result-pill.D{ background: var(--brass); color: #201E18; }

  /* ---- Section / table card (shared with Fixtures/Averages/Stats) ---- */
  .section-label{
    font-family: 'Fraunces', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin: 0 0 8px 2px;
  }
  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 26px; box-shadow: 0 1px 2px rgba(32,30,24,0.04);
  }
  .table-scroll{ position:relative; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius: var(--radius); }
  .table-scroll::after{
    content:""; position:absolute; top:0; right:0; bottom:0; width:28px;
    background: linear-gradient(to right, transparent, rgba(21,20,16,0.10));
    opacity:0; transition: opacity .15s ease; pointer-events:none;
  }
  .table-scroll.has-scroll::after{ opacity:1; }
  table{ width: 100%; min-width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th{
    text-align: right; font-family: 'Inter'; font-weight: 600; font-size: 10.5px;
    letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft);
    padding: 10px 8px; border-bottom: 1px solid var(--line-strong);
    background: var(--head-bg); white-space: nowrap;
  }
  thead th:first-child, td.name{ text-align: left; }
  tbody td{
    padding: 9px 8px; text-align: right; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap;
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr:nth-child(even){ background: var(--row-even); }
  td.name{ font-weight: 500; }
  a.player-link{ color: var(--ink); font-weight: 500; text-decoration: none; border-bottom: 1px solid transparent; }
  a.player-link:hover{ color: var(--accent); border-color: var(--accent-underline, var(--accent)); }
  thead th.how-out{ text-align:left; }
  td.how-out{ text-align:left; color: var(--ink-soft); }
  .not-out{ color: var(--accent); font-weight: 600; }
  .dup-flag{ display: inline-flex; vertical-align: -2px; margin-left: 5px; color: var(--gold-hover); cursor: default; }
  tr.dnb td{ color: var(--ink-soft); font-style: italic; }
  /* "Unsure" (see site/scorecard.html's nameCell()) reads the same whether
     or not it has a real recorded score - same muted/italic treatment as a
     "did not bat" row, not the bold player-name style, since there's no
     real identity behind it either way. */
  tr.unsure td{ color: var(--ink-soft); font-style: italic; font-weight: 400; }
  tr.extras-row td{ font-weight: 600; border-top: 2px solid var(--line-strong); background: var(--head-bg); }
  tr.total-row td{ font-weight: 700; font-size: 13.5px; background: var(--head-bg); }
  .extras-detail{ color: var(--ink-soft); font-weight: 500; font-size: 11.5px; }

  /* Sticky first column - matters most on mobile where the table scrolls horizontally */
  thead th:first-child{ position: sticky; left:0; z-index:3; background: var(--head-bg); }
  tbody td:first-child{ position: sticky; left:0; z-index:1; background: var(--card); }
  tbody tr:nth-child(even) td:first-child{ background: var(--row-even); }
  /* Extras/Total's sticky name cell would otherwise fall back to whichever
     light/grey stripe its row parity lands on, same issue the row background
     above just fixed for every other cell in the row. */
  tbody tr.extras-row td:first-child, tbody tr.total-row td:first-child{ background: var(--head-bg); }

  .note{ font-size: 11.5px; color: var(--ink-soft); text-align:center; margin-top: -8px; margin-bottom: 24px; line-height:1.5; }
  .page-message{ text-align:center; color: var(--ink-soft); font-size: 14px; padding: 40px 16px; }

  /* ============ LARGER SCREENS ============ */
  @media (min-width: 640px){
    .page{ padding: 0 20px 64px; }
    .site-nav{ margin: 0 -20px; }
    .site-nav-links a{ flex: none; padding: 12px 26px; font-size: 12.5px; }
    .match-header{ padding: 26px 30px 24px; }
    .match-teams{ font-size: 24px; }
    .match-meta{ font-size: 13px; }
    .score-summary{ flex-direction: row; gap: 32px; }
    .score-block{ flex-direction: column; align-items:flex-start; gap: 4px; border-bottom:none; padding-bottom:0; flex:1; }
    .score-figure{ font-size: 22px; }

    .section-label{ font-size: 13px; letter-spacing: 0.12em; margin: 0 0 10px 2px; }
    table{ font-size: 13.5px; }
    thead th{ font-size: 11.5px; padding: 12px 10px; }
    tbody td{ padding: 9px 10px; }
    .note{ font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="page">

  <nav class="site-nav">
    <div class="site-nav-links">
      <a href="fixtures.html" class="active">Fixtures</a>
      <a href="averages.html">Averages</a>
      <a href="stats.html">Stats</a>
      <a href="honours.html">Honours</a>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <a class="back-link" href="fixtures.html">&larr; Fixtures &amp; Results</a>

  <div id="pageMessage" class="page-message" style="display:none;"></div>

  <div id="scorecardContent" style="display:none;">
    <div class="match-header">
      <div class="match-teams" id="matchTeams"></div>
      <div class="match-meta" id="matchMeta"></div>
      <div class="score-summary">
        <div class="score-block">
          <span class="score-team us" id="usScoreTeam"></span>
          <span><span class="score-figure" id="usScoreFigure"></span><span class="score-overs" id="usScoreOvers"></span></span>
        </div>
        <div class="score-block">
          <span class="score-team" id="oppScoreTeam"></span>
          <span><span class="score-figure" id="oppScoreFigure"></span><span class="score-overs" id="oppScoreOvers"></span></span>
        </div>
      </div>
      <div class="match-result-row">
        <div class="match-result" id="matchResult"></div>
        <a class="pc-logo-link" id="pcLogoLink" target="_blank" rel="noopener noreferrer" style="display:none;">
          <img class="pc-logo" src="img/play-cricket-logo-white.png" alt="Play-Cricket" onerror="document.getElementById('pcLogoLink').style.display='none';">
        </a>
      </div>
    </div>

    <div id="tablesSection">
      <div class="section-label" id="battingLabel">Batting</div>
      <div class="card">
        <div class="table-scroll" id="battingScroll">
          <table>
            <thead><tr id="battingHead"></tr></thead>
            <tbody id="battingBody"></tbody>
          </table>
        </div>
      </div>

      <div class="section-label" id="bowlingLabel">Bowling</div>
      <div class="card">
        <div class="table-scroll" id="bowlingScroll">
          <table>
            <thead><tr id="bowlingHead"></tr></thead>
            <tbody id="bowlingBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="noScorecardNote" class="note" style="display:none;">No scorecard is available for this match.</div>
  </div>

</div>

<script src="js/duplicate-flags.js"></script>
<script>
const resultLabel = {W:"Won", L:"Lost", T:"Tied", D:"Drawn", A:"Abandoned", C:"Cancelled", CON:"Conceded"};
let flaggedNames = new Map();

const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return `${dayNames[dt.getUTCDay()]} ${d} ${monthNames[m-1]} ${y}`;
}

function oversToBalls(overs){
  const whole = Math.trunc(overs);
  const balls = Math.round((overs - whole) * 10); // ".4" -> 4 balls
  return whole * 6 + balls;
}

const battingCols = [
  {key:"name", label:"Player"}, {key:"howOut", label:"How Out"},
  {key:"runs", label:"R"}, {key:"balls", label:"B"},
  {key:"fours", label:"4s"}, {key:"sixes", label:"6s"}, {key:"sr", label:"SR"},
];
const bowlingCols = [
  {key:"name", label:"Player"}, {key:"overs", label:"O"}, {key:"maidens", label:"M"},
  {key:"runs", label:"R"}, {key:"wkts", label:"W"}, {key:"avg", label:"Avg"}, {key:"econ", label:"Econ"},
];

function renderHeader(match, usInnings, oppInnings, batting, bowling){
  const ourName = `Barwell CC ${match.team_name}`;
  document.title = `Fixtures - ${ourName} v ${match.opposition_name}`;
  document.getElementById('matchTeams').innerHTML =
    `${ourName} <span class="vs">v</span> ${match.opposition_name}`;
  document.getElementById('matchMeta').textContent =
    [formatDate(match.match_date), match.home_or_away === 'H' ? 'Home' : 'Away',
     match.display_label || match.display_type || match.competition_type, match.competition_name].filter(Boolean).join(' · ');
  const pcLogoLink = document.getElementById('pcLogoLink');
  if (match.playCricketUrl) {
    pcLogoLink.href = match.playCricketUrl;
    pcLogoLink.style.display = 'block';
  } else {
    pcLogoLink.style.display = 'none';
  }

  document.getElementById('usScoreTeam').textContent = ourName;
  document.getElementById('oppScoreTeam').textContent = match.opposition_name;

  // Historic matches (see scripts/parseScorecardPage.js) have innings rows
  // but no team total (runs/wickets/overs are null - the source export never
  // had them) and no result at all - render nothing for those pieces rather
  // than a literal "null/null" or a broken result pill.
  if (usInnings) {
    document.getElementById('usScoreFigure').textContent = usInnings.runs != null ? `${usInnings.runs}/${usInnings.wickets}` : '';
    document.getElementById('usScoreOvers').textContent = usInnings.overs != null ? `${usInnings.overs} overs` : '';
  }
  if (oppInnings) {
    document.getElementById('oppScoreFigure').textContent = oppInnings.runs != null ? `${oppInnings.runs}/${oppInnings.wickets}` : '';
    document.getElementById('oppScoreOvers').textContent = oppInnings.overs != null ? `${oppInnings.overs} overs` : '';
  }

  if (match.result) {
    const summary = match.resultSummary || resultLabel[match.result] || match.result;
    let html = `<span class="result-pill ${match.result}">${match.result}</span> ${summary}`;
    // No real scorecard (a walkover/concession/abandonment with no batting or
    // bowling figures - note some of these still carry placeholder 0/0
    // innings rows, so checking innings presence alone isn't enough) - the
    // plain pill alone ("Won"/"Conceded") reads like a normal result with a
    // table just below it that happens to be empty. result_description (from
    // Play-Cricket, once reconciled - see scripts/reconcilePlayCricket.js)
    // usually has the real context ("Won - Opposition Conceded") - show it
    // as a note instead of a bare pill.
    // A "did not bat" row is a squad-list placeholder, not a real innings
    // figure (see a conceded Midweek XI fixture where every one of 11
    // batting rows was "A.N. Other, did not bat") - doesn't count as a real
    // scorecard on its own.
    const realBatting = (batting || []).some((b) => b.how_out !== 'did not bat');
    const noRealScorecard = !realBatting && (!bowling || bowling.length === 0);
    if (noRealScorecard && match.result_description) {
      // Strip the leading "Barwell Cricket Club" / team-name / plain verb
      // restatement so this doesn't duplicate the pill+summary just shown
      // ("Won — Won - Opposition Conceded") - keep only the distinctive
      // part ("Opposition Conceded").
      const note = match.result_description
        .replace(/^Barwell (Cricket Club|CC)\s*-?\s*/i, '')
        .replace(new RegExp('^(' + Object.values(resultLabel).join('|') + ')\\s*-?\\s*', 'i'), '')
        .trim();
      if (note && note.toLowerCase() !== 'unknown') {
        html += `<span class="result-note"> — ${note}</span>`;
      }
    }
    document.getElementById('matchResult').innerHTML = html;
  } else {
    document.getElementById('matchResult').innerHTML = '';
  }
}

// "Unsure" is Play-Cricket's own placeholder for a real player whose
// identity the scorer didn't record (see scripts/buildStatic.js's
// buildScorecards()) - shown with its real recorded figures like anyone
// else, just as plain text rather than a link, since there's no real player
// profile behind the name to link to.
function nameCell(name){
  if (name === 'Unsure') return `<td class="name">${name}</td>`;
  return `<td class="name"><a class="player-link" href="player.html?name=${encodeURIComponent(name)}">${name}</a>${DuplicateFlags.badge(name, flaggedNames)}</td>`;
}

function renderBatting(batting, extras, teamTotal){
  document.getElementById("battingHead").innerHTML = battingCols.map(c => `<th class="${c.key === 'howOut' ? 'how-out' : ''}">${c.label}</th>`).join("");
  const rows = batting.map(r => {
    const howOut = r.how_out || '';
    const dnb = howOut === "did not bat";
    const notOut = howOut === "not out" || howOut === "retired not out";
    const sr = (r.balls != null && r.balls > 0) ? ((r.runs / r.balls) * 100).toFixed(1) : "";
    const runsCell = notOut ? `${r.runs}<span class="not-out">*</span>` : r.runs;
    return `<tr class="${r.name === 'Unsure' ? 'unsure' : (dnb ? 'dnb' : '')}">
      ${nameCell(r.name)}
      <td class="how-out">${howOut}</td>
      <td>${dnb ? '' : runsCell}</td>
      <td>${r.balls ?? ''}</td>
      <td>${r.fours ?? ''}</td>
      <td>${r.sixes ?? ''}</td>
      <td>${sr}</td>
    </tr>`;
  }).join("");
  const extrasParts = [
    extras.extra_byes ? `${extras.extra_byes}b` : null,
    extras.extra_leg_byes ? `${extras.extra_leg_byes}lb` : null,
    extras.extra_wides ? `${extras.extra_wides}w` : null,
    extras.extra_no_balls ? `${extras.extra_no_balls}nb` : null,
  ].filter(Boolean).join(" ");
  // Historic innings never have extras or a team total recorded (see
  // scripts/parseScorecardPage.js) - skip these rows entirely rather than
  // showing an empty "Extras" line or a literal "null/null" total.
  const extrasRow = extras.total_extras != null
    ? `<tr class="extras-row"><td class="name">Extras</td><td class="how-out extras-detail">${extrasParts}</td><td colspan="4"></td><td>${extras.total_extras}</td></tr>`
    : '';
  const totalRow = teamTotal.runs != null
    ? `<tr class="total-row"><td class="name">Total</td><td class="how-out">${teamTotal.overs != null ? `${teamTotal.overs} overs` : ''}</td><td colspan="4"></td><td>${teamTotal.runs}/${teamTotal.wkts}</td></tr>`
    : '';
  document.getElementById("battingBody").innerHTML = rows + extrasRow + totalRow;
}

function renderBowling(bowling, oppInnings){
  document.getElementById("bowlingHead").innerHTML = bowlingCols.map(c => `<th>${c.label}</th>`).join("");
  const rows = bowling.map(r => {
    const actualOvers = oversToBalls(r.overs) / 6;
    const econ = (r.runs / actualOvers).toFixed(1);
    const avg = r.wkts > 0 ? (r.runs / r.wkts).toFixed(1) : "-";
    return `<tr class="${r.name === 'Unsure' ? 'unsure' : ''}">
      ${nameCell(r.name)}
      <td>${r.overs}</td>
      <td>${r.maidens}</td>
      <td>${r.runs}</td>
      <td>${r.wkts}</td>
      <td>${avg}</td>
      <td>${econ}</td>
    </tr>`;
  }).join("");

  // Wides/no-balls are already included in the bowler they were bowled
  // against (his own runs-conceded figure) - only byes/leg-byes/penalty runs
  // are nobody's figure, so that's the portion that needs its own row for
  // the R column to sum to the innings total (matches the header score).
  const nonBowlerExtras = oppInnings.total_extras != null
    ? oppInnings.total_extras - (oppInnings.extra_wides || 0) - (oppInnings.extra_no_balls || 0) - (oppInnings.extra_penalty_runs || 0)
    : null;
  const extrasParts = [
    oppInnings.extra_byes ? `${oppInnings.extra_byes}b` : null,
    oppInnings.extra_leg_byes ? `${oppInnings.extra_leg_byes}lb` : null,
    oppInnings.extra_penalty_runs ? `${oppInnings.extra_penalty_runs}pen` : null,
  ].filter(Boolean).join(" ");
  // Same row shape as renderBatting's Extras/Total rows below - label,
  // detail/overs text, a colspan gap, one number pinned to the last column -
  // so both tables read consistently instead of bowling's totals landing
  // mid-row under O/M/R/W with empty cells trailing after them.
  const extrasRow = nonBowlerExtras != null
    ? `<tr class="extras-row"><td class="name">Extras</td><td class="extras-detail" style="text-align:left">${extrasParts}</td><td colspan="4"></td><td>${nonBowlerExtras}</td></tr>`
    : '';
  const totalRow = oppInnings.runs != null
    ? `<tr class="total-row"><td class="name">Total</td><td style="text-align:left">${oppInnings.overs != null ? `${oppInnings.overs} overs` : ''}</td><td colspan="4"></td><td>${oppInnings.runs}/${oppInnings.wickets}</td></tr>`
    : '';
  document.getElementById("bowlingBody").innerHTML = rows + extrasRow + totalRow;
}

function showMessage(text){
  const el = document.getElementById('pageMessage');
  el.textContent = text;
  el.style.display = 'block';
  document.getElementById('scorecardContent').style.display = 'none';
}

// ---- Horizontal-scroll hint for tables (shows a fade only when there's more to scroll) ----
function initScrollHint(container){
  function update(){
    const table = container.querySelector('table');
    container.classList.toggle('has-scroll', table.scrollWidth - container.clientWidth > 4 && container.scrollLeft < table.scrollWidth - container.clientWidth - 4);
  }
  container.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  update();
}

// ---- Theme toggle (light/dark), persisted across pages via localStorage ----
function getEffectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('barwellcc-theme', next);
});

(async function init(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { showMessage('No match selected.'); return; }

  let res;
  try {
    [res, flaggedNames] = await Promise.all([
      fetch(`data/scorecards/${id}.json`),
      DuplicateFlags.fetchFlaggedNames(),
    ]);
  } catch (err) {
    showMessage('Could not load the scorecard data.');
    return;
  }

  // Scorecards only exist for matches with a result - an upcoming fixture
  // or an unknown id both just come back 404 from a static file fetch.
  if (res.status === 404) { showMessage('Match not found, or hasn’t been played yet.'); return; }
  if (!res.ok) { showMessage('Something went wrong loading this scorecard.'); return; }

  const { match, usInnings, oppInnings, batting, bowling } = await res.json();

  document.getElementById('scorecardContent').style.display = 'block';
  renderHeader(match, usInnings, oppInnings, batting, bowling);

  if (!usInnings || !oppInnings) {
    document.getElementById('tablesSection').style.display = 'none';
    document.getElementById('noScorecardNote').style.display = 'block';
    return;
  }

  renderBatting(batting, usInnings, { runs: usInnings.runs, wkts: usInnings.wickets, overs: usInnings.overs });
  renderBowling(bowling, oppInnings);
  initScrollHint(document.getElementById('battingScroll'));
  initScrollHint(document.getElementById('bowlingScroll'));
})();
</script>
