<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barwell CC — Fixtures &amp; Results</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A5478">
<script>
// Applied before paint so a stored preference doesn't flash the other theme.
(function(){
  var stored = localStorage.getItem('barwellcc-theme');
  if(stored === 'dark' || stored === 'light') document.documentElement.setAttribute('data-theme', stored);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    /* Navy sampled from the club's actual crest (barwellcc.co.uk), replacing
       the site's earlier invented green - see site/scorecard.html for the
       full rationale. Fixed, same in both themes. */
    --pitch-green: #1A5478;
    --pitch-green-dark: #0D3550;
    --cream: #F6F1E4;
    /* Light-mode neutrals used to share --brass's exact hue (~43deg), just
       lighter/desaturated - fine against the old green structure, but once
       gold became a real accent colour (--gold-hover on dropdown borders/checkbox ticks) that
       meant the "neutral" backgrounds were secretly the same colour as the
       accent, so gold never read as distinct - everything sat in one muddy
       warm family with navy alone on the outside. Desaturated these toward
       true neutral gray (same hue kept faintly, ~9-15% saturation instead of
       30-50%) so both navy and gold pop against genuinely neutral scaffolding
       instead of competing with a tinted background. */
    --bg-page: #F4F3F1;
    --card: #FDFDFC;
    --row-even: #F1F0EE;
    --head-bg: #E8E6E3;
    --ink: #201E18;
    --ink-soft: #5B5548;
    /* --accent used to be a maroon/red (text/links/scores/section labels) -
       replaced with a blue from the same navy family as --pitch-green, but
       more saturated so it still reads as a distinct "accent" rather than a
       repeat of the muted structural navy. --win/--loss (result pills) are
       untouched - green/red there is a functional win-loss code, not a
       branding colour. */
    --maroon: #1A5478;
    --accent: #0A6CB3;
    --brass: #B8923A;
    --brass-bright: #D4AF5A;
    /* Gold for interactive chrome specifically (hover/open borders, checkbox
       ticks) - brass in light mode, the lighter brass-bright in dark mode
       since plain brass is too washed-out against a dark card to read as a
       highlight. Separate from --accent (blue, for text/links/scores) and
       --pitch-green (navy, structural) - three-tone system, more gold
       throughout without every hover state turning into body-text blue. */
    --gold-hover: var(--brass);
    --line: #DCDAD5;
    --line-strong: #BFBBB0;
    --win: #2F5D3A;
    --loss: #7A2E2E;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* Dark neutrals shifted from a green tint to a navy tint (bg-page/card/
         row-even/head-bg/line/line-strong), to match the new crest-navy
         scheme instead of the site's old invented green. */
      --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
      --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5; --gold-hover: var(--brass-bright);
      --line: #2B3944; --line-strong: #3D4F5C; --win: #4F8C5C; --loss: #C1584F;
    }
  }
  :root[data-theme="dark"]{
    --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
    --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5; --gold-hover: var(--brass-bright);
    --line: #2B3944; --line-strong: #3D4F5C; --win: #4F8C5C; --loss: #C1584F;
    color-scheme: dark;
  }
  :root[data-theme="light"]{ color-scheme: light; }
  /* Reserves the scrollbar gutter always, whether or not the page is tall
     enough to need it - otherwise .page's centering shifts a few pixels
     depending on content height (e.g. Stats before/after a search returns
     results, or between pages with very different row counts), which reads
     as "the container is a different width" even though max-width is the
     same everywhere. */
  html{ scrollbar-gutter: stable; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ============ MOBILE-FIRST BASE STYLES ============ */
  body{
    margin:0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .15s ease, color .15s ease;
  }
  .page{ max-width: 980px; margin: 0 auto; padding: 0 12px 48px; }

  /* ---- Shared site nav (Fixtures / Averages / Stats) + theme toggle ---- */
  .site-nav{ display:flex; align-items:stretch; background: var(--pitch-green-dark); margin: 0 -12px; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; position:relative; }
  .site-nav-links{ display:flex; flex:1; }
  .site-nav-links a{
    flex: 1 1 0; text-align:center; padding: 11px 8px;
    font-family:'Inter'; font-weight:600; font-size: 12px; letter-spacing:0.05em; text-transform:uppercase;
    color: rgba(246,241,228,0.62); text-decoration:none; border-bottom: 2px solid transparent;
  }
  .site-nav-links a:hover{ color: var(--cream); }
  .site-nav-links a.active{ color: var(--brass-bright); border-bottom-color: var(--brass); }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width: 42px; border:none; border-left: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(246,241,228,0.62); cursor:pointer; padding:0;
  }
  .theme-toggle:hover{ color: var(--brass-bright); }
  .theme-toggle svg{ width:16px; height:16px; }
  /* ---- Nav data-review flag - only appears when there's genuinely
     something to review (mismatches/import errors from the Play-Cricket
     reconciliation, or possible duplicate players); no counts shown here,
     just a generic "needs review" signal - see site/reconcile.html and
     site/duplicates.html for the actual detail. Hidden by default. ---- */
  /* Desktop only - see the "LARGER SCREENS" media query below for the
     min-width:640px override that actually shows it. Mobile's nav is
     already tight (four links + theme toggle); a staff-only review nudge
     isn't worth the extra crowding for the site's general (non-staff)
     mobile visitors. */
  .nav-flag-wrap{ display:none; position:relative; flex-shrink:0; }
  .nav-flag{
    display:flex; align-items:center; justify-content:center; position:relative;
    width: 42px; height:100%; border:none; border-left: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(246,241,228,0.62); cursor:pointer; padding:0;
  }
  .nav-flag:hover{ color: var(--brass-bright); }
  .nav-flag svg{ width:16px; height:16px; }
  .nav-flag .dot{
    position:absolute; top:9px; right:10px; width:7px; height:7px; border-radius:50%;
    background: var(--loss); border: 1.5px solid var(--pitch-green-dark);
  }
  /* position:fixed and placed outside .site-nav in the DOM (not just
     visually) - .site-nav has overflow:hidden for its own rounded bottom
     corners, which would otherwise clip this dropdown regardless of its own
     position scheme, since overflow clipping applies to descendants by DOM
     containment, not by position/containing-block. top/right set by JS from
     the flag button's getBoundingClientRect() on open. */
  .nav-flag-menu{
    position:fixed; z-index: 20; min-width: 210px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,0.18); padding: 6px; display:none;
  }
  .nav-flag-menu.open{ display:block; }
  .nav-flag-menu a{
    display:block; padding: 9px 10px; border-radius: 6px; font-size: 12.5px; font-weight:600;
    color: var(--ink); text-decoration:none;
  }
  .nav-flag-menu a:hover{ background: var(--head-bg); }
  .theme-toggle .icon-sun{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{ display:block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{ display:none; }
  }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }

  /* ---- White card housing the filter dropdowns (same as Averages/Stats) ---- */
  .search-card{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-top: 18px; margin-bottom: 22px; box-shadow: 0 1px 2px rgba(32,30,24,0.04);
  }

  /* ---- Controls: stacked full-width on mobile ---- */
  .filter-row{
    display:flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .filter-group{ display:flex; flex-direction:column; gap:5px; }
  .filter-label{
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  /* ---- Multi-select dropdown (Fixture Type) ---- */
  .msel{ position:relative; }
  .msel-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width: 100%;
    font-family:'Inter'; font-size: 14px; font-weight: 600;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .msel-btn:hover{ border-color: var(--gold-hover); }
  .msel.open .msel-btn{ border-color: var(--gold-hover); }
  .msel-arrow{ font-size: 9px; color: var(--ink-soft); transition: transform .15s ease; flex-shrink:0; }
  .msel.open .msel-arrow{ transform: rotate(180deg); }
  .msel-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(21,20,16,0.16); padding: 8px;
    max-height: 280px; overflow-y: auto;
  }
  .msel.open .msel-panel{ display:block; }
  .msel-actions{ display:flex; gap:12px; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .msel-action{ background:none; border:none; padding:0; font-size: 11.5px; font-weight: 700; color: var(--accent); cursor: pointer; }
  .msel-action:hover{ text-decoration: underline; }
  .msel-item{ display:flex; align-items:center; gap:8px; padding: 8px 6px; border-radius: 5px; font-size: 14px; cursor: pointer; }
  .msel-item:hover{ background: rgba(32,30,24,0.06); }
  .msel-item input{ accent-color: var(--gold-hover); width: 16px; height: 16px; flex-shrink:0; }
  .msel-item-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msel-only{ flex-shrink:0; }

  /* ---- Single-select pick list (Team, Season) ---- */
  .pick{
    width: 100%; font-family: 'Inter'; font-size: 16px; font-weight: 600;
    padding: 9px 30px 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink); cursor: pointer; appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B5548"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center;
  }
  .pick:hover{ border-color: var(--gold-hover); }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .pick{
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
    }
  }
  :root[data-theme="dark"] .pick{
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
  }

  /* ---- Section / table card ---- */
  .results-label{ display:flex; align-items:baseline; justify-content: space-between; margin: 0 2px 8px; }
  .section-label{
    font-family: 'Fraunces', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin: 0;
  }
  .results-right{ display:flex; align-items:baseline; gap: 14px; }
  .results-count{ font-size: 12px; color: var(--ink-soft); }
  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 26px; box-shadow: 0 1px 2px rgba(32,30,24,0.04);
  }
  .table-scroll{ position:relative; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius: var(--radius); }
  .table-scroll::after{
    content:""; position:absolute; top:0; right:0; bottom:0; width:28px;
    background: linear-gradient(to right, transparent, rgba(21,20,16,0.10));
    opacity:0; transition: opacity .15s ease; pointer-events:none;
  }
  .table-scroll.has-scroll::after{ opacity:1; }
  table{ width: 100%; min-width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th{
    text-align: left; font-family: 'Inter'; font-weight: 600; font-size: 10.5px;
    letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-soft);
    padding: 10px 8px; border-bottom: 1px solid var(--line-strong);
    background: var(--head-bg); cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover{ color: var(--accent); }
  thead th .arrow{ display:inline-block; width: 9px; opacity: 0.35; font-size: 9px; }
  thead th.sorted .arrow{ opacity: 1; color: var(--accent); }
  tbody td{
    padding: 9px 8px; text-align: left; font-variant-numeric: tabular-nums;
    border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap;
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr:nth-child(even){ background: var(--row-even); }

  /* Sticky first column - matters most on mobile where the table scrolls horizontally */
  thead th:first-child{ position: sticky; left:0; z-index:3; background: var(--head-bg); }
  tbody td:first-child{ position: sticky; left:0; z-index:1; background: var(--card); }
  tbody tr:nth-child(even) td:first-child{ background: var(--row-even); }

  td.opp{ font-weight: 500; }
  .venue-pill{
    display:inline-block; font-size: 10.5px; font-weight: 700; letter-spacing:0.03em;
    padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--ink-soft);
  }
  .comp-pill{ font-size: 11px; color: var(--ink-soft); }

  /* Venue and Fixture Type columns dropped on mobile - Venue folds into the
     Opposition cell instead as "(H)"/"(A)" (see .venue-inline below), and
     Type is already filterable via the dropdown above. Restored at the
     desktop breakpoint below, where there's room for a dedicated column
     each. */
  #fixturesTable th:nth-child(4), #fixturesTable td:nth-child(4),
  #fixturesTable th:nth-child(5), #fixturesTable td:nth-child(5){ display:none; }
  .venue-inline{ color: var(--ink-soft); font-weight: 600; margin-left: 4px; }
  .result-pill{
    display:inline-flex; align-items:center; justify-content:center;
    width: 20px; height:20px; border-radius: 5px; font-size: 11px; font-weight: 700;
    background: var(--line-strong); color: var(--ink-soft); /* neutral fallback for any result code without specific styling below */
  }
  .result-pill.W{ background: var(--win); color:#fff; }
  .result-pill.L{ background: var(--loss); color:#fff; }
  .result-pill.T, .result-pill.D{ background: var(--brass); color: #201E18; }
  .result-row{ display:flex; align-items:center; }
  /* Hidden on mobile - the margin text ("by 14 runs") is what pushes this
     table into needing a horizontal scroll on a phone width; the pill alone
     (W/L/T/etc) carries the result. Restored at the desktop breakpoint below,
     where there's room for it. */
  .score-text{ color: var(--ink-soft); font-size: 11.5px; display:none; margin-left:7px; }
  .upcoming-text{ color: var(--ink-soft); font-style: italic; }
  tr.upcoming td{ color: var(--ink-soft); }
  tr.no-records td{
    text-align: center; color: var(--ink-soft); font-style: italic;
    padding: 22px 8px; position: static; background: none;
  }
  tr.completed{ cursor: pointer; }
  tr.completed:hover td{ background: var(--head-bg); }
  a.result-link{ display:flex; align-items:center; color: inherit; text-decoration: none; }

  /* Opposition names can be long ("Loughborough Carillon CC 1st XI") - let
     this column wrap onto a second line on mobile rather than forcing the
     whole table wider than the screen (every other column is short and
     fixed-width, so this is the one column that can safely give). */
  td.opp{ white-space: normal; }

  /* ============ LARGER SCREENS ============ */
  @media (min-width: 640px){
    .page{ padding: 0 20px 64px; }
    .site-nav{ margin: 0 -20px; }
    .site-nav-links a{ flex: none; padding: 12px 26px; font-size: 12.5px; }
    .nav-flag-wrap.visible{ display:flex; }

    .search-card{ padding: 22px 24px; }
    .filter-row{ flex-direction: row; align-items:center; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
    .filter-group{ flex-direction: row; align-items:center; gap:8px; }
    .filter-group.season-group{ margin-left: auto; }
    .msel-btn{ width:auto; min-width:170px; }
    .pick{ width:auto; font-size: 14px; }
    #teamPick{ min-width: 220px; }
    /* Same width as Fixture Type's msel (170px default) - matches Averages/Stats. */
    #seasonPick{ min-width: 170px; }

    .score-text{ display:inline; }
    td.opp{ white-space: nowrap; }
    #fixturesTable th:nth-child(4), #fixturesTable td:nth-child(4),
    #fixturesTable th:nth-child(5), #fixturesTable td:nth-child(5){ display:table-cell; }
    .venue-inline{ display:none; }

    .section-label{ font-size: 13px; letter-spacing: 0.12em; }
    table{ font-size: 13.5px; }
    thead th{ font-size: 11.5px; padding: 12px 10px; }
    tbody td{ padding: 9px 10px; }
  }
</style>
</head>
<body>
<div class="page">

  <nav class="site-nav">
    <div class="site-nav-links">
      <a href="fixtures.html" class="active">Fixtures</a>
      <a href="averages.html">Averages</a>
      <a href="stats.html">Stats</a>
      <a href="honours.html">Honours</a>
    </div>
    <div class="nav-flag-wrap" id="navFlagWrap">
      <button type="button" class="nav-flag" id="navFlagBtn" aria-label="Data review needed" title="Data review needed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span class="dot"></span>
      </button>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
  <div class="nav-flag-menu" id="navFlagMenu"></div>

  <div class="search-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Team</span>
        <select class="pick" id="teamPick"></select>
      </div>

      <div class="filter-group">
        <span class="filter-label">Fixture Type</span>
        <div class="msel" id="compSelect">
          <button type="button" class="msel-btn"><span class="msel-label">All</span><span class="msel-arrow">▾</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>

      <div class="filter-group season-group">
        <span class="filter-label">Season</span>
        <select class="pick" id="seasonPick"></select>
      </div>
    </div>
  </div>

  <div class="results-label">
    <p class="section-label">Fixtures &amp; Results</p>
    <div class="results-right">
      <button type="button" class="msel-action" id="copyLinkBtn">Copy Link</button>
      <span class="results-count" id="resultsCount"></span>
    </div>
  </div>
  <div class="card">
    <div class="table-scroll" id="fixturesScroll">
      <table id="fixturesTable">
        <thead><tr id="fixturesHead"></tr></thead>
        <tbody id="fixturesBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
let fixtures = [];

const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  return `${dayNames[dt.getUTCDay()]} ${d} ${monthNames[m-1]} ${y}`;
}

// A handful of historic matches carry a garbled source time (25:00/25:30 -
// not a real hour of the day, a scraper-side parsing quirk) - treat those
// the same as a genuinely missing time rather than showing a broken value.
function formatTime(t){
  if (!t) return '';
  const [h, m] = t.split(':').map(Number);
  if (h == null || h >= 24) return '';
  const suffix = h >= 12 ? 'pm' : 'am';
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2, '0')}${suffix}`;
}

const cols = [
  {key:"date", label:"Date"},
  {key:"time", label:"Time"},
  {key:"opp", label:"Opposition"},
  {key:"venue", label:"Venue"},
  {key:"comp", label:"Type"},
  {key:"result", label:"Result"},
];

function renderTable(data, headEl, bodyEl){
  headEl.innerHTML = cols.map((c,i) => `<th data-i="${i}">${c.label}<span class="arrow">▲</span></th>`).join("");

  function draw(rows){
    bodyEl.innerHTML = rows.length ? rows.map(r => {
      // Historic matches (r.played) never carry a result - see
      // scripts/parseScorecardPage.js - but they did happen, unlike a
      // genuinely upcoming Play-Cricket fixture with no result yet. A
      // handful of historic fixtures have no result at all (the club's own
      // site never recorded a definite outcome for them) - those don't get
      // a clickable pill/link either, same as a genuinely upcoming fixture,
      // rather than linking to a scorecard with no real result to show.
      const upcoming = !r.played;
      // A cancelled fixture never happened - its "scorecard" is just an
      // empty 0/0 innings with the whole squad marked "did not bat" (see
      // scripts/buildStatic.js), nothing worth linking to. Treated the same
      // as "no result recorded" below: not clickable, no scorecard link.
      const cancelled = r.result === 'C';
      const hasResult = !upcoming && !!r.result && !cancelled;
      let resultCell;
      // Upcoming/cancelled/no-result get the same compact pill+label shape
      // as a completed result (pill always visible, label hidden on mobile
      // via .score-text) instead of spelling the whole word out on a phone,
      // where "Upcoming" alone was wide enough to force a horizontal scroll.
      if (upcoming) {
        resultCell = `<span class="result-row"><span class="result-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="12" height="12"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></span><span class="score-text upcoming-text">Upcoming</span></span>`;
      } else if (cancelled) {
        resultCell = `<span class="result-row"><span class="result-pill">C</span><span class="score-text upcoming-text">Cancelled</span></span>`;
      } else if (hasResult) {
        resultCell = `<a class="result-link" href="${r.sc}"><span class="result-pill ${r.result}">${r.result}</span><span class="score-text">${r.resultSummary}</span></a>`;
      } else {
        resultCell = `<span class="result-row"><span class="result-pill">?</span><span class="score-text upcoming-text">No result recorded</span></span>`;
      }
      return `<tr class="${hasResult ? 'completed' : 'upcoming'}" data-sc="${r.sc}">
        <td>${formatDate(r.date)}</td>
        <td>${formatTime(r.time)}</td>
        <td class="opp">${r.opp}<span class="venue-inline">(${r.venue === 'H' ? 'H' : 'A'})</span></td>
        <td><span class="venue-pill">${r.venue === 'H' ? 'Home' : 'Away'}</span></td>
        <td class="comp-pill">${r.comp}</td>
        <td>${resultCell}</td>
      </tr>`;
    }).join("") : `<tr class="no-records"><td colspan="${cols.length}">No records to display.</td></tr>`;
    [...bodyEl.querySelectorAll('tr.completed')].forEach(tr => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('a')) return; // let the link itself navigate natively
        window.location.href = tr.dataset.sc;
      });
    });
    document.getElementById('resultsCount').textContent = `${rows.length} fixture${rows.length === 1 ? '' : 's'}`;
  }
  draw(data);

  let sortState = { i: 0, dir: 1 };
  [...headEl.children].forEach((th, i) => {
    th.addEventListener("click", () => {
      sortState.dir = (sortState.i === i) ? -sortState.dir : 1;
      sortState.i = i;
      [...headEl.children].forEach(h => h.classList.remove("sorted"));
      th.classList.add("sorted");
      th.querySelector(".arrow").textContent = sortState.dir === 1 ? "▲" : "▼";
      const key = cols[i].key;
      const sorted = [...data].sort((a, b) => {
        let av = a[key], bv = b[key];
        if (key === "result") { av = av || "zzz"; bv = bv || "zzz"; }
        if (typeof av === "string" && typeof bv === "string") return av.localeCompare(bv) * sortState.dir;
        return (av - bv) * sortState.dir;
      });
      draw(sorted);
    });
  });
}

// ---- Reusable multi-select dropdown (Fixture Type) ----
function initMultiSelect(root, {options, selected, labelForNone, onChange}){
  const btn = root.querySelector('.msel-btn');
  const labelEl = root.querySelector('.msel-label');
  const panel = root.querySelector('.msel-panel');
  let state = new Set(selected);

  function renderLabel(){
    if(state.size === 0) labelEl.textContent = labelForNone || 'All';
    else if(state.size === options.length) labelEl.textContent = 'All';
    else if(state.size === 1) labelEl.textContent = [...state][0];
    else labelEl.textContent = state.size + ' selected';
  }

  panel.innerHTML = '';
  const actions = document.createElement('div');
  actions.className = 'msel-actions';
  actions.innerHTML = '<button type="button" class="msel-action" data-a="all">Select all</button><button type="button" class="msel-action" data-a="clear">Clear</button>';
  panel.appendChild(actions);
  actions.querySelector('[data-a="all"]').addEventListener('click', (e) => { e.stopPropagation(); options.forEach(o=>state.add(o)); sync(); });
  actions.querySelector('[data-a="clear"]').addEventListener('click', (e) => { e.stopPropagation(); state.clear(); sync(); });

  options.forEach(opt => {
    const label = document.createElement('label');
    label.className = 'msel-item';
    label.innerHTML = `<input type="checkbox" value="${opt}"> <span class="msel-item-label">${opt}</span><button type="button" class="msel-action msel-only">Only</button>`;
    panel.appendChild(label);
    const cb = label.querySelector('input');
    cb.checked = state.has(opt);
    cb.addEventListener('change', () => {
      if (cb.checked) state.add(opt); else state.delete(opt);
      renderLabel();
      onChange && onChange([...state]);
    });
    // preventDefault stops the label's native click-forwards-to-checkbox
    // behaviour, which would otherwise also toggle the checkbox this sits
    // beside every time "Only" is clicked.
    label.querySelector('.msel-only').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      state = new Set([opt]);
      sync();
    });
  });

  function sync(){
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = state.has(cb.value); });
    renderLabel();
    onChange && onChange([...state]);
  }

  renderLabel();
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.msel.open').forEach(m => { if (m !== root) m.classList.remove('open'); });
    root.classList.toggle('open');
  });
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) root.classList.remove('open'); });

  return { get selected(){ return [...state]; } };
}

const compOptions = ["League", "Cup", "Friendly"];
let compMsel;
let allMatches = [];

function applyCompFilter(selectedComps){
  const filtered = selectedComps.length === 0
    ? []
    : fixtures.filter(f => selectedComps.includes(f.comp));
  renderTable(filtered, document.getElementById("fixturesHead"), document.getElementById("fixturesBody"));
}

function loadFixtures(){
  const team = document.getElementById('teamPick').value;
  const season = Number(document.getElementById('seasonPick').value);
  fixtures = allMatches
    .filter(m => m.team === team && m.season === season)
    .map(m => ({
      date: m.date, time: m.time, opp: m.opp, venue: m.venue, comp: m.comp, result: m.result,
      resultSummary: m.resultSummary, played: m.played,
      sc: `scorecard.html?id=${m.id}`,
    }));
  applyCompFilter(compMsel.selected);
}

async function loadTeamsAndSeasons(){
  allMatches = await fetch('data/matches.json').then(r => r.json());

  const teams = [...new Set(allMatches.map(m => m.team))].sort();
  const seasons = [...new Set(allMatches.map(m => m.season))].sort((a, b) => b - a);

  const teamPick = document.getElementById('teamPick');
  teamPick.innerHTML = teams.map(t => `<option value="${t}">${t}</option>`).join('');

  const seasonPick = document.getElementById('seasonPick');
  seasonPick.innerHTML = seasons.map(s => `<option value="${s}">${s}</option>`).join('');

  const params = new URLSearchParams(location.search);
  const teamParam = params.get('team');
  teamPick.value = teamParam && teams.includes(teamParam) ? teamParam : (teams.includes('1st XI') ? '1st XI' : teams[0]);

  const seasonParam = Number(params.get('season'));
  seasonPick.value = seasons.includes(seasonParam) ? String(seasonParam) : String(seasons[0]);
}

// ---- Reflect the current search in the URL, so a filtered view can be
// bookmarked/shared as a link that reproduces the same results on load.
function syncUrl(){
  const params = new URLSearchParams();
  const team = document.getElementById('teamPick').value;
  const season = document.getElementById('seasonPick').value;
  if (team) params.set('team', team);
  if (season) params.set('season', season);
  if (compMsel && compMsel.selected.length && compMsel.selected.length < compOptions.length) params.set('comp', compMsel.selected.join(','));
  const qs = params.toString();
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

// ---- Horizontal-scroll hint for tables (shows a fade only when there's more to scroll) ----
function initScrollHint(container){
  function update(){
    const table = container.querySelector('table');
    container.classList.toggle('has-scroll', table.scrollWidth - container.clientWidth > 4 && container.scrollLeft < table.scrollWidth - container.clientWidth - 4);
  }
  container.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  update();
}
initScrollHint(document.getElementById('fixturesScroll'));

// ---- Theme toggle (light/dark), persisted across pages via localStorage ----
function getEffectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('barwellcc-theme', next);
});

// ---- Nav data-review flag: shows only if there's something a staff member
// needs to look at (see site/reconcile.html and site/duplicates.html for
// the actual detail) - no counts here on purpose, this nav is public.
Promise.all([
  fetch('data/reconciliation.json').then(r => r.json()).catch(() => null),
  fetch('data/duplicate-candidates.json').then(r => r.json()).catch(() => []),
]).then(([reconciliation, duplicates]) => {
  const items = [];
  if (reconciliation && reconciliation.mismatches && reconciliation.mismatches.length > 0) {
    items.push({ label: 'Mismatches need review', href: 'reconcile.html#mismatchesSection' });
  }
  if (reconciliation && reconciliation.import_errors && reconciliation.import_errors.length > 0) {
    items.push({ label: 'Import errors need review', href: 'reconcile.html#importErrorsSection' });
  }
  if (duplicates && duplicates.length > 0) {
    items.push({ label: 'Possible duplicate players', href: 'duplicates.html' });
  }
  if (items.length === 0) return;

  const wrap = document.getElementById('navFlagWrap');
  const btn = document.getElementById('navFlagBtn');
  const menu = document.getElementById('navFlagMenu');
  menu.innerHTML = items.map((i) => `<a href="${i.href}">${i.label}</a>`).join('');
  wrap.classList.add('visible');

  function positionMenu() {
    const r = btn.getBoundingClientRect();
    menu.style.top = `${r.bottom + 6}px`;
    menu.style.right = `${window.innerWidth - r.right}px`;
  }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!menu.classList.contains('open')) positionMenu();
    menu.classList.toggle('open');
  });
  window.addEventListener('resize', () => { if (menu.classList.contains('open')) positionMenu(); });
  // Close on an outside click, but not a click on the menu's own links -
  // otherwise removing the 'open' class (display:none) mid-click can cancel
  // the link's own navigation in some browsers, since the element becomes
  // hidden before the browser processes the pending "follow this link"
  // action for the same click.
  document.addEventListener('click', (e) => {
    if (menu.contains(e.target)) return;
    menu.classList.remove('open');
  });
}).catch(() => {});

function parseListParam(params, name, allOptions){
  const raw = params.get(name);
  if (!raw) return null;
  const valid = raw.split(',').map(s => s.trim()).filter(v => allOptions.includes(v));
  return valid.length ? valid : null;
}

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyLinkBtn');
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = 'Copied!';
  } catch (e) {
    window.prompt('Copy this link:', location.href);
    return;
  }
  setTimeout(() => { btn.textContent = 'Copy Link'; }, 1500);
});

(async function init(){
  const params = new URLSearchParams(location.search);
  const compSel = parseListParam(params, 'comp', compOptions) || compOptions;
  compMsel = initMultiSelect(document.getElementById('compSelect'), {
    options: compOptions, selected: compSel, onChange: (sel) => { applyCompFilter(sel); syncUrl(); }
  });
  await loadTeamsAndSeasons();
  document.getElementById('teamPick').addEventListener('change', () => { loadFixtures(); syncUrl(); });
  document.getElementById('seasonPick').addEventListener('change', () => { loadFixtures(); syncUrl(); });
  await loadFixtures();
  syncUrl();
})();
</script>
