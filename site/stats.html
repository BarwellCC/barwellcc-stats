<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barwell CC — Stats</title>
<link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1A5478">
<script>
// Applied before paint so a stored preference doesn't flash the other theme.
(function(){
  var stored = localStorage.getItem('barwellcc-theme');
  if(stored === 'dark' || stored === 'light') document.documentElement.setAttribute('data-theme', stored);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light dark;
    /* Navy sampled from the club's actual crest (barwellcc.co.uk), replacing
       the site's earlier invented green - see site/scorecard.html for the
       full rationale. Fixed, same in both themes; the brighter dark-mode
       --pitch-green override below (for text/border uses sitting directly
       on --card rather than a solid fill) follows the same --accent-style
       logic as before, just with a navy family bright enough to read on a
       dark card instead of the old bright green. */
    --pitch-green: #1A5478;
    --pitch-green-dark: #0D3550;
    --cream: #F6F1E4;
    /* Light-mode neutrals used to share --brass's exact hue (~43deg), just
       lighter/desaturated - fine against the old green structure, but once
       gold became a real accent colour (--gold-hover on dropdown borders/checkbox ticks) that
       meant the "neutral" backgrounds were secretly the same colour as the
       accent, so gold never read as distinct - everything sat in one muddy
       warm family with navy alone on the outside. Desaturated these toward
       true neutral gray (same hue kept faintly, ~9-15% saturation instead of
       30-50%) so both navy and gold pop against genuinely neutral scaffolding
       instead of competing with a tinted background. */
    --bg-page: #F4F3F1;
    --card: #FDFDFC;
    --row-even: #F1F0EE;
    --head-bg: #E8E6E3;
    --ink: #201E18;
    --ink-soft: #5B5548;
    /* --accent used to be a maroon/red (text/links/scores/section labels) -
       replaced with a blue from the same navy family as --pitch-green, but
       more saturated so it still reads as a distinct "accent" rather than a
       repeat of the muted structural navy. */
    --maroon: #1A5478;
    --accent: #0A6CB3;
    --accent-underline: rgba(10,108,179,0.35);
    --brass: #B8923A;
    --brass-bright: #D4AF5A;
    /* Gold for interactive chrome specifically (hover/open borders, checkbox
       ticks) - brass in light mode, the lighter brass-bright in dark mode
       since plain brass is too washed-out against a dark card to read as a
       highlight. Separate from --accent (blue, for text/links/scores) and
       --pitch-green (navy, structural) - three-tone system, more gold
       throughout without every hover state turning into body-text blue. */
    --gold-hover: var(--brass);
    --line: #DCDAD5;
    --line-strong: #BFBBB0;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      /* Dark neutrals shifted from a green tint to a navy tint (bg-page/card/
         row-even/head-bg/line/line-strong), to match the new crest-navy
         scheme instead of the site's old invented green. */
      --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
      --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5; --pitch-green: #5B9BD5; --gold-hover: var(--brass-bright);
      --accent-underline: rgba(91,155,213,0.4); --line: #2B3944; --line-strong: #3D4F5C;
    }
  }
  :root[data-theme="dark"]{
    --bg-page: #12191F; --card: #1B242C; --row-even: #202B34; --head-bg: #26323C;
    --ink: #E9E4D6; --ink-soft: #A3A093; --accent: #5B9BD5; --pitch-green: #5B9BD5; --gold-hover: var(--brass-bright);
    --accent-underline: rgba(91,155,213,0.4); --line: #2B3944; --line-strong: #3D4F5C;
    color-scheme: dark;
  }
  :root[data-theme="light"]{ color-scheme: light; }
  /* Reserves the scrollbar gutter always, whether or not the page is tall
     enough to need it - otherwise .page's centering shifts a few pixels
     depending on content height (e.g. Stats before/after a search returns
     results, or between pages with very different row counts), which reads
     as "the container is a different width" even though max-width is the
     same everywhere. */
  html{ scrollbar-gutter: stable; }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* ============ MOBILE-FIRST BASE STYLES ============ */
  body{
    margin:0;
    background: var(--bg-page);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background .15s ease, color .15s ease;
  }
  .page{ max-width: 980px; margin: 0 auto; padding: 0 12px 48px; }

  /* ---- Shared site nav (Fixtures / Stats / Averages) + theme toggle ---- */
  .site-nav{ display:flex; align-items:stretch; background: var(--pitch-green-dark); margin: 0 -12px; border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; position:relative; }
  .site-nav-links{ display:flex; flex:1; }
  .site-nav-links a{
    flex: 1 1 0; text-align:center; padding: 11px 8px;
    font-family:'Inter'; font-weight:600; font-size: 12px; letter-spacing:0.05em; text-transform:uppercase;
    color: rgba(246,241,228,0.62); text-decoration:none; border-bottom: 2px solid transparent;
  }
  .site-nav-links a:hover{ color: var(--cream); }
  .site-nav-links a.active{ color: var(--brass-bright); border-bottom-color: var(--brass); }
  .theme-toggle{
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    width: 42px; border:none; border-left: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(246,241,228,0.62); cursor:pointer; padding:0;
  }
  .theme-toggle:hover{ color: var(--brass-bright); }
  .theme-toggle svg{ width:16px; height:16px; }
  /* ---- Nav data-review flag - only appears when there's genuinely
     something to review (mismatches/import errors from the Play-Cricket
     reconciliation, or possible duplicate players); no counts shown here,
     just a generic "needs review" signal - see site/reconcile.html and
     site/duplicates.html for the actual detail. Hidden by default. ---- */
  /* Desktop only - see the "LARGER SCREENS" media query below for the
     min-width:640px override that actually shows it. Mobile's nav is
     already tight (four links + theme toggle); a staff-only review nudge
     isn't worth the extra crowding for the site's general (non-staff)
     mobile visitors. */
  .nav-flag-wrap{ display:none; position:relative; flex-shrink:0; }
  .nav-flag{
    display:flex; align-items:center; justify-content:center; position:relative;
    width: 42px; height:100%; border:none; border-left: 1px solid rgba(255,255,255,0.1);
    background: transparent; color: rgba(246,241,228,0.62); cursor:pointer; padding:0;
  }
  .nav-flag:hover{ color: var(--brass-bright); }
  .nav-flag svg{ width:16px; height:16px; }
  .nav-flag .dot{
    position:absolute; top:9px; right:10px; width:7px; height:7px; border-radius:50%;
    background: var(--loss); border: 1.5px solid var(--pitch-green-dark);
  }
  /* position:fixed and placed outside .site-nav in the DOM (not just
     visually) - .site-nav has overflow:hidden for its own rounded bottom
     corners, which would otherwise clip this dropdown regardless of its own
     position scheme, since overflow clipping applies to descendants by DOM
     containment, not by position/containing-block. top/right set by JS from
     the flag button's getBoundingClientRect() on open. */
  .nav-flag-menu{
    position:fixed; z-index: 20; min-width: 210px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,0.18); padding: 6px; display:none;
  }
  .nav-flag-menu.open{ display:block; }
  .nav-flag-menu a{
    display:block; padding: 9px 10px; border-radius: 6px; font-size: 12.5px; font-weight:600;
    color: var(--ink); text-decoration:none;
  }
  .nav-flag-menu a:hover{ background: var(--head-bg); }
  .theme-toggle .icon-sun{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .theme-toggle .icon-sun{ display:block; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon{ display:none; }
  }
  :root[data-theme="dark"] .theme-toggle .icon-sun{ display:block; }
  :root[data-theme="dark"] .theme-toggle .icon-moon{ display:none; }

  .tabs{ display:flex; gap:6px; margin-top: 18px; margin-bottom: 16px; }
  .tab{
    flex:1 1 0; text-align:center;
    font-size: 13px; font-weight: 600; padding: 9px 12px; border-radius: 999px;
    border: 1px solid var(--line-strong); background: var(--card); color: var(--ink-soft);
    cursor: pointer; transition: all .15s ease;
  }
  .tab:hover{ border-color: var(--pitch-green); color: var(--pitch-green); }
  .tab.active{ background: var(--pitch-green); border-color: var(--pitch-green); color: var(--cream); }
  /* Belt-and-braces: a combined selector always outranks .tab:hover or
     .tab.active alone on specificity, so the active tab's text can't lose
     to the hover color regardless of which theme/variable path is active. */
  .tab.active:hover{ color: var(--cream); }

  .search-card{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; margin-bottom: 22px; box-shadow: 0 1px 2px rgba(32,30,24,0.04);
  }
  .search-lead{ font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; line-height:1.5; }
  /* ---- Global Team/Fixture Type/Season row - same component as Averages
     and the Player page, so this filter reads identically everywhere it
     appears rather than as a Stats-specific variant. ---- */
  .filter-row{ display:flex; flex-direction:column; align-items:stretch; gap:8px; }
  .filter-group{ display:flex; flex-direction:column; gap:5px; }
  .filter-label{ font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .field-grid{ display:grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 14px; }
  .field label{
    display:block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px;
  }
  .field select, .field input{
    width: 100%; font-family: 'Inter'; font-size: 16px; padding: 9px 10px;
    border-radius: 6px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
  }
  .field select{
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B5548"/></svg>');
    background-repeat: no-repeat; background-position: right 12px center; padding-right: 28px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .field select{
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
    }
  }
  :root[data-theme="dark"] .field select{
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
  }
  .range-row{ display:flex; align-items:flex-end; gap: 10px; }
  .range-row .field{ flex: 1; }
  .range-and{ padding-bottom: 9px; font-size: 13px; color: var(--ink-soft); }
  .wickets-row{
    display:flex; align-items:center; flex-wrap:wrap; gap: 8px;
    font-size: 14px; color: var(--ink); margin-bottom: 16px;
  }
  .wickets-row select{
    width: 62px; font-family: 'Inter'; font-size: 15px; font-weight: 600; padding: 8px 22px 8px 10px;
    border-radius: 6px; border: 1px solid var(--line-strong); background: var(--card); color: var(--ink);
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%235B5548"/></svg>');
    background-repeat: no-repeat; background-position: right 8px center;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .wickets-row select{
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
    }
  }
  :root[data-theme="dark"] .wickets-row select{
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%23A3A093"/></svg>');
  }
  /* ---- Multi/single-select dropdown ---- */
  .msel{ position:relative; }
  .msel-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    width: 100%; font-family:'Inter'; font-size: 14px; font-weight: 600;
    padding: 9px 12px; border-radius: 6px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .msel-btn:hover{ border-color: var(--gold-hover); }
  .msel.open .msel-btn{ border-color: var(--gold-hover); }
  .msel-arrow{ font-size: 9px; color: var(--ink-soft); transition: transform .15s ease; flex-shrink:0; }
  .msel.open .msel-arrow{ transform: rotate(180deg); }
  .msel-panel{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:20;
    background: var(--card); border: 1px solid var(--line-strong); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(21,20,16,0.16); padding: 8px;
    max-height: 280px; overflow-y: auto;
  }
  .msel.open .msel-panel{ display:block; }
  .msel-actions{ display:flex; gap:12px; padding: 4px 6px 8px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .msel-action{ background:none; border:none; padding:0; font-size: 11.5px; font-weight: 700; color: var(--accent); cursor: pointer; }
  .msel-action:hover{ text-decoration: underline; }
  .msel-item{ display:flex; align-items:center; gap:8px; padding: 8px 6px; border-radius: 5px; font-size: 14px; cursor: pointer; }
  .msel-item:hover{ background: rgba(32,30,24,0.06); }
  .msel-item input{ accent-color: var(--gold-hover); width: 16px; height: 16px; flex-shrink:0; }
  .msel-item-label{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .msel-only{ flex-shrink:0; }

  .results-label{ display:flex; align-items:baseline; justify-content: space-between; margin: 0 2px 8px; }
  .section-label{
    font-family: 'Fraunces', serif; font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); margin:0;
  }
  .results-right{ display:flex; align-items:baseline; gap: 14px; }
  .results-count{ font-size: 12px; color: var(--ink-soft); }

  .card{
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 26px; box-shadow: 0 1px 2px rgba(32,30,24,0.04);
  }
  .table-scroll{ position:relative; overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius: var(--radius); }
  .table-scroll::after{
    content:""; position:absolute; top:0; right:0; bottom:0; width:28px;
    background: linear-gradient(to right, transparent, rgba(21,20,16,0.10));
    opacity:0; transition: opacity .15s ease; pointer-events:none;
  }
  .table-scroll.has-scroll::after{ opacity:1; }
  table{ width: 100%; min-width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th{
    text-align: left; font-weight: 600; font-size: 10.5px; letter-spacing: 0.02em;
    text-transform: uppercase; color: var(--ink-soft); padding: 10px 8px;
    border-bottom: 1px solid var(--line-strong); background: var(--head-bg);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:hover{ color: var(--accent); }
  thead th .arrow{ display:inline-block; width: 9px; opacity: 0.35; font-size: 9px; }
  thead th.sorted .arrow{ opacity: 1; color: var(--accent); }
  thead th.num{ text-align: right; }
  tbody td{ padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
  tbody tr:last-child td{ border-bottom: none; }
  tbody tr:nth-child(even){ background: var(--row-even); }
  td.score{ font-variant-numeric: tabular-nums; text-align:right; font-weight: 700; color: var(--accent); }
  .not-out{ color: var(--pitch-green); font-weight: 700; }
  .dup-flag{ display: inline-flex; vertical-align: -2px; margin-left: 5px; color: var(--gold-hover); cursor: default; }
  .venue-away{ color: var(--ink-soft); }
  /* Venue folds into the Opposition cell as "(H)"/"(A)" on mobile instead of
     its own column (same treatment as Fixtures) - Venue is always the last
     column on both Batting and Bowling (7 vs 9 columns), so :last-child
     covers both tabs without needing separate column-count-specific rules. */
  .venue-inline{ color: var(--ink-soft); font-weight: 600; }
  thead th:last-child, tbody td:last-child{ display:none; }
  a.player-link{ color: var(--ink); font-weight: 500; text-decoration: none; border-bottom: 1px solid transparent; }
  a.player-link:hover{ color: var(--accent); border-color: var(--accent-underline); }

  /* Sticky first column - matters most on mobile where the table scrolls horizontally */
  thead th:first-child{ position: sticky; left:0; z-index:3; background: var(--head-bg); }
  tbody td:first-child{ position: sticky; left:0; z-index:1; background: var(--card); }
  tbody tr:nth-child(even) td:first-child{ background: var(--row-even); }

  /* Score is frozen alongside the name too - `left` is set from JS
     (freezeSecondColumn) since the name column's width is content-dependent,
     not a fixed value CSS could hardcode. */
  thead th:nth-child(2){ position: sticky; z-index:3; background: var(--head-bg); }
  tbody td:nth-child(2){ position: sticky; z-index:1; background: var(--card); }
  tbody tr:nth-child(even) td:nth-child(2){ background: var(--row-even); }

  /* Whole row navigates to the scorecard (not just a text link) - comes after
     the sticky-column rules above so the hover tint wins there too (same
     specificity, source order breaks the tie), not just on the other cells. */
  tbody tr[data-sc]{ cursor: pointer; }
  tbody tr[data-sc]:hover td{ background: var(--head-bg); }

  tr.no-records td{
    text-align: center; color: var(--ink-soft); font-style: italic;
    padding: 22px 8px; position: static; background: none;
  }

  /* ============ LARGER SCREENS ============ */
  @media (min-width: 640px){
    .page{ padding: 0 20px 64px; }
    .site-nav{ margin: 0 -20px; }
    .site-nav-links a{ flex: none; padding: 12px 26px; font-size: 12.5px; }
    .nav-flag-wrap.visible{ display:flex; }

    .tabs{ gap:6px; }
    .tab{ flex: none; padding: 8px 18px; }

    .search-card{ padding: 22px 24px; }
    .search-lead{ font-size: 12.5px; }
    .filter-row{ flex-direction: row; align-items:center; flex-wrap: wrap; gap: 10px; justify-content: space-between; }
    .filter-group{ flex-direction: row; align-items:center; gap:8px; }
    .filter-group.season-group{ margin-left: auto; }
    .msel-btn{ width:auto; min-width:170px; }
    #teamSelect .msel-btn{ min-width: 220px; }
    .field-grid{ grid-template-columns: 1fr 1fr; gap: 14px 24px; }
    .field select, .field input, .msel-btn{ font-size: 14px; }

    table{ font-size: 13.5px; }
    thead th{ font-size: 11.5px; padding: 12px 12px; }
    tbody td{ padding: 10px 12px; }
    thead th:last-child, tbody td:last-child{ display:table-cell; }
    .venue-inline{ display:none; }
  }
</style>
</head>
<body>
<div class="page">

  <nav class="site-nav">
    <div class="site-nav-links">
      <a href="fixtures.html">Fixtures</a>
      <a href="averages.html">Averages</a>
      <a href="stats.html" class="active">Stats</a>
      <a href="honours.html">Honours</a>
    </div>
    <div class="nav-flag-wrap" id="navFlagWrap">
      <button type="button" class="nav-flag" id="navFlagBtn" aria-label="Data review needed" title="Data review needed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
        <span class="dot"></span>
      </button>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>
  <div class="nav-flag-menu" id="navFlagMenu"></div>

  <div class="tabs">
    <div class="tab active" data-tab="batting">Batting</div>
    <div class="tab" data-tab="bowling">Bowling</div>
  </div>

  <div class="search-card">
    <div class="filter-row">
      <div class="filter-group">
        <span class="filter-label">Team</span>
        <div class="msel" id="teamSelect">
          <button type="button" class="msel-btn"><span class="msel-label">All</span><span class="msel-arrow">▾</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Fixture Type</span>
        <div class="msel" id="compSelect">
          <button type="button" class="msel-btn"><span class="msel-label">All</span><span class="msel-arrow">▾</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
      <div class="filter-group season-group">
        <span class="filter-label">Season</span>
        <div class="msel" id="seasonSelect">
          <button type="button" class="msel-btn"><span class="msel-label">All</span><span class="msel-arrow">▾</span></button>
          <div class="msel-panel"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="search-card">
    <p class="search-lead">Select a player to search their individual innings/spells, optionally narrowed by score or wickets.</p>
    <div class="field-grid" style="grid-template-columns: 1fr; max-width: 340px;">
      <div class="field">
        <label>Player</label>
        <select id="playerPick"><option value="">--Select a Player--</option></select>
      </div>
    </div>
    <div class="range-row" id="scoreRangeRow" style="max-width: 340px; margin-bottom:16px;">
      <div class="field">
        <label>Scores between</label>
        <input type="text" inputmode="numeric" placeholder="no lower limit" id="scoreMin">
      </div>
      <div class="range-and">and</div>
      <div class="field">
        <input type="text" inputmode="numeric" placeholder="no upper limit" id="scoreMax" style="margin-top: 21px;">
      </div>
    </div>
    <div class="wickets-row" id="wicketsRow" style="display:none;">
      <span>Show performances with</span>
      <select id="minWickets">
        <option value="0" selected>0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
      </select>
      <span>wickets or more.</span>
    </div>
  </div>

  <div class="results-label">
    <p class="section-label">Results</p>
    <div class="results-right">
      <button type="button" class="msel-action" id="copyLinkBtn">Copy Link</button>
      <span class="results-count" id="resultsCount"></span>
    </div>
  </div>

  <div class="card">
    <div class="table-scroll" id="resultsScroll">
      <table>
        <thead><tr id="resultsHead"></tr></thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/cricket-calc.js"></script>
<script src="js/duplicate-flags.js"></script>
<script>
let activeTab = 'batting';
let results = [];
let flaggedNames = new Map();

function numOrNull(v){
  if (v === '') return null;
  const n = Number(v);
  return Number.isNaN(n) ? null : n;
}

const dayMonths = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function formatDate(iso){
  const [y,m,d] = iso.split("-").map(Number);
  return `${String(d).padStart(2,'0')} ${dayMonths[m-1]} ${y}`;
}

const battingCols = [
  {key:"player", label:"Player"},
  {key:"score", label:"Score", numClass:"num"},
  {key:"date", label:"Date", parse: v => new Date(v).getTime()},
  {key:"team", label:"Team"},
  {key:"fixture", label:"Fixture"},
  {key:"opp", label:"Opposition"},
  {key:"venue", label:"Venue"},
];
const bowlingCols = [
  {key:"player", label:"Player"},
  {key:"score", label:"Wkts", numClass:"num"},
  {key:"figures", label:"Figures"},
  {key:"overs", label:"Overs", numClass:"num"},
  {key:"date", label:"Date", parse: v => new Date(v).getTime()},
  {key:"team", label:"Team"},
  {key:"fixture", label:"Fixture"},
  {key:"opp", label:"Opposition"},
  {key:"venue", label:"Venue"},
];
function currentCols(){ return activeTab === 'batting' ? battingCols : bowlingCols; }

function cellHtml(r, c){
  const val = r[c.key];
  if (c.key === "player") {
    return `<td><a class="player-link" href="player.html?name=${encodeURIComponent(val)}">${val}</a>${DuplicateFlags.badge(val, flaggedNames)}</td>`;
  }
  if (c.key === "score" && activeTab === 'batting') {
    return `<td class="score">${val}${r.notOut ? '<span class="not-out">*</span>' : ''}</td>`;
  }
  if (c.key === "score") return `<td class="score">${val}</td>`;
  if (c.key === "date") return `<td>${formatDate(val)}</td>`;
  if (c.key === "venue") return `<td class="${val === 'A' ? 'venue-away' : ''}">${val === 'H' ? 'Home' : 'Away'}</td>`;
  if (c.key === "opp") return `<td>${val}<span class="venue-inline">(${r.venue === 'H' ? 'H' : 'A'})</span></td>`;
  return `<td>${val}</td>`;
}

function draw(rows){
  const cols = currentCols();
  document.getElementById("resultsBody").innerHTML = rows.length
    ? rows.map(r => `<tr data-sc="scorecard.html?id=${r.matchId}">${cols.map(c => cellHtml(r, c)).join("")}</tr>`).join("")
    : `<tr class="no-records"><td colspan="${cols.length}">No records to display.</td></tr>`;
  freezeSecondColumn(document.querySelector("#resultsScroll table"));
}

// Score is frozen next to the name column, same as the name column itself -
// but its `left` offset depends on the name column's rendered width, which
// varies with content/viewport, so it can't be a fixed CSS value.
function freezeSecondColumn(table){
  const firstTh = table && table.querySelector('thead th:first-child');
  if (!firstTh) return;
  const left = firstTh.getBoundingClientRect().width + 'px';
  table.querySelectorAll('th:nth-child(2), td:nth-child(2)').forEach(el => { el.style.left = left; });
}
window.addEventListener('resize', () => freezeSecondColumn(document.querySelector("#resultsScroll table")));

// Whole row navigates to the scorecard - delegated on the tbody so it keeps
// working across every re-render (sort, filter change) without needing to
// re-attach a listener per row.
document.getElementById('resultsBody').addEventListener('click', (e) => {
  if (e.target.closest('a')) return; // let the player link itself navigate natively
  const tr = e.target.closest('tr[data-sc]');
  if (tr) window.location.href = tr.dataset.sc;
});

function renderHead(){
  const cols = currentCols();
  const headEl = document.getElementById("resultsHead");
  // Defaults to sorted by Date, most recent first - results arrive pre-sorted
  // this way from loadStats(), so the header needs to say so too rather than
  // showing every arrow dim as if nothing were sorted yet.
  const defaultSortIndex = cols.findIndex(c => c.key === 'date');
  headEl.innerHTML = cols.map((c,i) =>
    `<th class="${c.numClass||''} ${i === defaultSortIndex ? 'sorted' : ''}" data-i="${i}">${c.label}${c.label ? `<span class="arrow">${i === defaultSortIndex ? '▼' : '▲'}</span>` : ''}</th>`
  ).join("");

  let sortState = { i: defaultSortIndex, dir: -1 };
  [...headEl.children].forEach((th, i) => {
    const col = cols[i];
    if (!col.label) return; // scorecard column isn't sortable
    th.addEventListener("click", () => {
      sortState.dir = (sortState.i === i) ? -sortState.dir : 1;
      sortState.i = i;
      [...headEl.children].forEach(h => h.classList.remove("sorted"));
      th.classList.add("sorted");
      const arrow = th.querySelector(".arrow");
      if (arrow) arrow.textContent = sortState.dir === 1 ? "▲" : "▼";

      const sorted = [...results].sort((a, b) => {
        let av = a[col.key], bv = b[col.key];
        if (col.parse) { av = col.parse(av); bv = col.parse(bv); }
        if (typeof av === "string" && typeof bv === "string") return av.localeCompare(bv) * sortState.dir;
        return (av - bv) * sortState.dir;
      });
      draw(sorted);
    });
  });
}

function renderEmpty(message){
  results = [];
  renderHead();
  draw(results);
  document.getElementById('resultsCount').textContent = message;
  syncUrl();
}

function loadStats(){
  const player = document.getElementById('playerPick').value;
  if (!player) {
    renderEmpty('0 innings');
    return;
  }

  const teams = teamMsel.selected;
  const seasons = seasonMsel.selected;
  const comps = compMsel.selected;

  if (teams.length === 0 || seasons.length === 0 || comps.length === 0) {
    renderEmpty('0 innings');
    return;
  }

  const filter = {
    teams: teams.length < teamOptions.length ? teams : null,
    seasons: seasons.length < seasonOptions.length ? seasons : null,
    comps: comps.length < compOptions.length ? comps : null,
    player,
  };

  if (activeTab === 'batting') {
    filter.min = numOrNull(document.getElementById('scoreMin').value.trim());
    filter.max = numOrNull(document.getElementById('scoreMax').value.trim());
  } else {
    filter.min = Number(document.getElementById('minWickets').value);
    filter.max = null;
  }

  const rows = activeTab === 'batting' ? battingRows : bowlingRows;
  const calc = activeTab === 'batting' ? CricketCalc.statsBatting : CricketCalc.statsBowling;
  // calc() itself returns rows sorted by score/wickets - re-sort to match the
  // Date-descending default the header now shows (most recent innings first).
  results = calc(rows, filter).sort((a, b) => new Date(b.date) - new Date(a.date));
  renderHead();
  draw(results);
  document.getElementById('resultsCount').textContent = `${results.length} innings`;
  syncUrl();
}

function activateTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
  document.getElementById('scoreRangeRow').style.display = tab === 'batting' ? 'flex' : 'none';
  document.getElementById('wicketsRow').style.display = tab === 'bowling' ? 'flex' : 'none';
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  activateTab(t.dataset.tab);
  loadStats();
}));

// ---- Reflect the current search in the URL, so a filtered view can be
// bookmarked/shared as a link that reproduces the same results on load.
// A param is only written when it narrows the default ("All"/latest season/
// League/batting), keeping plain/default URLs short.
function parseListParam(params, name, allOptions){
  const raw = params.get(name);
  if (!raw) return null;
  const valid = raw.split(',').map(s => s.trim()).filter(v => allOptions.includes(v));
  return valid.length ? valid : null;
}

function syncUrl(){
  const params = new URLSearchParams();
  if (teamMsel && teamMsel.selected.length && teamMsel.selected.length < teamOptions.length) params.set('team', teamMsel.selected.join(','));
  if (compMsel && compMsel.selected.length && compMsel.selected.length < compOptions.length) params.set('comp', compMsel.selected.join(','));
  if (seasonMsel && seasonMsel.selected.length && seasonMsel.selected.length < seasonOptions.length) params.set('season', seasonMsel.selected.join(','));
  params.set('tab', activeTab);
  const player = document.getElementById('playerPick').value;
  if (player) params.set('player', player);
  if (activeTab === 'batting') {
    const min = document.getElementById('scoreMin').value.trim();
    const max = document.getElementById('scoreMax').value.trim();
    if (min) params.set('min', min);
    if (max) params.set('max', max);
  } else {
    const wkts = document.getElementById('minWickets').value;
    if (wkts && wkts !== '0') params.set('wkts', wkts);
  }
  const qs = params.toString();
  history.replaceState(null, '', qs ? `?${qs}` : location.pathname);
}

document.getElementById('copyLinkBtn').addEventListener('click', async () => {
  const btn = document.getElementById('copyLinkBtn');
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = 'Copied!';
  } catch (e) {
    window.prompt('Copy this link:', location.href);
    return;
  }
  setTimeout(() => { btn.textContent = 'Copy Link'; }, 1500);
});

['scoreMin', 'scoreMax'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') loadStats(); });
  document.getElementById(id).addEventListener('blur', loadStats);
});
document.getElementById('minWickets').addEventListener('change', loadStats);
document.getElementById('playerPick').addEventListener('change', loadStats);

// ---- Reusable single/multi-select dropdown (same component as the averages page) ----
function initMultiSelect(root, {options, selected, labelForNone, onChange}){
  const btn = root.querySelector('.msel-btn');
  const labelEl = root.querySelector('.msel-label');
  const panel = root.querySelector('.msel-panel');
  let state = new Set(selected);

  function renderLabel(){
    if(state.size === 0) labelEl.textContent = labelForNone || 'All';
    else if(state.size === options.length) labelEl.textContent = 'All';
    else if(state.size === 1) labelEl.textContent = [...state][0];
    else labelEl.textContent = state.size + ' selected';
  }

  const actions = document.createElement('div');
  actions.className = 'msel-actions';
  actions.innerHTML = '<button type="button" class="msel-action" data-a="all">Select all</button><button type="button" class="msel-action" data-a="clear">Clear</button>';
  panel.appendChild(actions);
  actions.querySelector('[data-a="all"]').addEventListener('click', (e) => { e.stopPropagation(); options.forEach(o=>state.add(o)); sync(); });
  actions.querySelector('[data-a="clear"]').addEventListener('click', (e) => { e.stopPropagation(); state.clear(); sync(); });

  options.forEach(opt => {
    const label = document.createElement('label');
    label.className = 'msel-item';
    label.innerHTML = `<input type="checkbox" value="${opt}"> <span class="msel-item-label">${opt}</span><button type="button" class="msel-action msel-only">Only</button>`;
    panel.appendChild(label);
    const cb = label.querySelector('input');
    cb.checked = state.has(opt);
    cb.addEventListener('change', () => {
      if (cb.checked) state.add(opt); else state.delete(opt);
      renderLabel();
      onChange && onChange([...state]);
    });
    // preventDefault stops the label's native click-forwards-to-checkbox
    // behaviour, which would otherwise also toggle the checkbox this sits
    // beside every time "Only" is clicked.
    label.querySelector('.msel-only').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      state = new Set([opt]);
      sync();
    });
  });

  function sync(){
    panel.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = state.has(cb.value); });
    renderLabel();
    onChange && onChange([...state]);
  }

  renderLabel();
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.msel.open').forEach(m => { if (m !== root) m.classList.remove('open'); });
    root.classList.toggle('open');
  });
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) root.classList.remove('open'); });

  return { get selected(){ return [...state]; } };
}

let teamOptions = [];
let seasonOptions = [];
const compOptions = ["League", "Cup", "Friendly"];
let teamMsel, seasonMsel, compMsel;
let battingRows = [], bowlingRows = [];
let initialPlayerParam = '';

// Matches scripts/teams.js's SENIOR_TEAMS order - plain alphabetical sort
// puts "Midweek 2nd XI" before "Midweek XI" (digit sorts before letter),
// which reads wrong since Midweek XI is the senior of the two sides.
const TEAM_ORDER = ['1st XI', '2nd XI', '3rd XI', 'Midweek XI', 'Midweek 2nd XI', 'Sunday XI'];
function byTeamOrder(a, b){
  const ia = TEAM_ORDER.indexOf(a), ib = TEAM_ORDER.indexOf(b);
  if (ia === -1 && ib === -1) return a.localeCompare(b);
  if (ia === -1) return 1;
  if (ib === -1) return -1;
  return ia - ib;
}

async function loadFilters(){
  const [matches, batRows, bowlRows, flagged] = await Promise.all([
    fetch('data/matches.json').then(r => r.json()),
    fetch('data/batting.json').then(r => r.json()),
    fetch('data/bowling.json').then(r => r.json()),
    DuplicateFlags.fetchFlaggedNames(),
  ]);
  battingRows = batRows;
  bowlingRows = bowlRows;
  flaggedNames = flagged;

  teamOptions = [...new Set(matches.map(m => m.team))].sort(byTeamOrder);
  seasonOptions = [...new Set(matches.map(m => m.season))].sort((a, b) => b - a).map(String);
  const latestSeason = seasonOptions[0]; // sorted newest-first above

  const params = new URLSearchParams(location.search);
  const teamSel = parseListParam(params, 'team', teamOptions) || teamOptions;
  const seasonSel = parseListParam(params, 'season', seasonOptions) || [latestSeason];
  const compSel = parseListParam(params, 'comp', compOptions) || ['League'];
  initialPlayerParam = params.get('player') || '';
  if (params.get('min')) document.getElementById('scoreMin').value = params.get('min');
  if (params.get('max')) document.getElementById('scoreMax').value = params.get('max');
  if (params.get('wkts')) document.getElementById('minWickets').value = params.get('wkts');
  activateTab(params.get('tab') === 'bowling' ? 'bowling' : 'batting');

  teamMsel = initMultiSelect(document.getElementById('teamSelect'), {
    options: teamOptions, selected: teamSel, onChange: refreshPlayerOptions
  });
  seasonMsel = initMultiSelect(document.getElementById('seasonSelect'), {
    options: seasonOptions, selected: seasonSel, onChange: refreshPlayerOptions
  });
  compMsel = initMultiSelect(document.getElementById('compSelect'), {
    options: compOptions, selected: compSel, onChange: refreshPlayerOptions
  });

  refreshPlayerOptions();
}

// Only offer players who actually have a qualifying innings under the
// current Team/Season/Fixture Type selection - otherwise most of the ~200
// names in the club's history return "0 innings" under whatever narrower
// scope happens to be selected (e.g. the League-only, latest-season
// default), which reads as broken rather than just an empty search.
function refreshPlayerOptions(){
  const teams = teamMsel.selected;
  const seasons = seasonMsel.selected;
  const comps = compMsel.selected;

  const filter = {
    teams: teams.length < teamOptions.length ? teams : null,
    seasons: seasons.length < seasonOptions.length ? seasons : null,
    comps: comps.length < compOptions.length ? comps : null,
  };
  const players = CricketCalc.playersInScope(battingRows, bowlingRows, filter);

  const playerPick = document.getElementById('playerPick');
  const current = playerPick.value || initialPlayerParam;
  initialPlayerParam = ''; // only ever applied on the first call, after that the live selection wins
  playerPick.innerHTML = '<option value="">--Select a Player--</option>' +
    players.map(p => `<option value="${p}">${p}</option>`).join('');
  playerPick.value = players.includes(current) ? current : '';

  loadStats();
}

// ---- Horizontal-scroll hint for the results table ----
function initScrollHint(container){
  function update(){
    const table = container.querySelector('table');
    container.classList.toggle('has-scroll', table.scrollWidth - container.clientWidth > 4 && container.scrollLeft < table.scrollWidth - container.clientWidth - 4);
  }
  container.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  update();
}
initScrollHint(document.getElementById('resultsScroll'));

// ---- Theme toggle (light/dark), persisted across pages via localStorage ----
function getEffectiveTheme(){
  const attr = document.documentElement.getAttribute('data-theme');
  if (attr) return attr;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('barwellcc-theme', next);
});

// ---- Nav data-review flag: shows only if there's something a staff member
// needs to look at (see site/reconcile.html and site/duplicates.html for
// the actual detail) - no counts here on purpose, this nav is public.
Promise.all([
  fetch('data/reconciliation.json').then(r => r.json()).catch(() => null),
  fetch('data/duplicate-candidates.json').then(r => r.json()).catch(() => []),
  fetch('data/suspicious-names.json').then(r => r.json()).catch(() => []),
]).then(([reconciliation, duplicates, suspiciousNames]) => {
  const items = [];
  if (reconciliation && reconciliation.mismatches && reconciliation.mismatches.length > 0) {
    items.push({ label: 'Mismatches need review', href: 'reconcile.html#mismatchesSection' });
  }
  if (reconciliation && reconciliation.import_errors && reconciliation.import_errors.length > 0) {
    items.push({ label: 'Import errors need review', href: 'reconcile.html#importErrorsSection' });
  }
  if ((duplicates && duplicates.length > 0) || (suspiciousNames && suspiciousNames.length > 0)) {
    items.push({ label: 'Player records need review', href: 'duplicates.html' });
  }
  if (items.length === 0) return;

  const wrap = document.getElementById('navFlagWrap');
  const btn = document.getElementById('navFlagBtn');
  const menu = document.getElementById('navFlagMenu');
  menu.innerHTML = items.map((i) => `<a href="${i.href}">${i.label}</a>`).join('');
  wrap.classList.add('visible');

  function positionMenu() {
    const r = btn.getBoundingClientRect();
    menu.style.top = `${r.bottom + 6}px`;
    menu.style.right = `${window.innerWidth - r.right}px`;
  }
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!menu.classList.contains('open')) positionMenu();
    menu.classList.toggle('open');
  });
  window.addEventListener('resize', () => { if (menu.classList.contains('open')) positionMenu(); });
  // Close on an outside click, but not a click on the menu's own links -
  // otherwise removing the 'open' class (display:none) mid-click can cancel
  // the link's own navigation in some browsers, since the element becomes
  // hidden before the browser processes the pending "follow this link"
  // action for the same click.
  document.addEventListener('click', (e) => {
    if (menu.contains(e.target)) return;
    menu.classList.remove('open');
  });
}).catch(() => {});

(async function init(){
  renderEmpty('0 innings');
  await loadFilters();
})();
</script>
